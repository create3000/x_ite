{% if page.jquery %}
<script defer
   src="https://cdn.jsdelivr.net/npm/jquery@4.0.0/dist/jquery.slim.min.js"
   integrity="sha384-tcspKDb5tWvyRCOWzevlAeQgHeEzYdUHJpcgnIhcP9w4CnfD7DLAcS+k9QzLbRJO"
   crossorigin="anonymous"></script>
{% endif %}

<script type="module">
document .querySelector ("a[href='/x_ite/components/']")
   .setAttribute ("href", "/x_ite/components/overview/");
document .querySelector ("a[href='/x_ite/reference/']")
   .setAttribute ("href", "/x_ite/reference/ecmascript-object-and-function-definitions/");
document .querySelector ("a[href='/x_ite/tutorials/']")
   .setAttribute ("href", "/x_ite/tutorials/overview/");
document .querySelector ("a[href='/x_ite/laboratory/']")
   .setAttribute ("href", "/x_ite/laboratory/overview/");
document .querySelector ("a[href='/x_ite/editor/']")
   .setAttribute ("href", "/sunrize/");
</script>

{% if content contains '<x3d-canvas' or content contains '<x3d-script-area' or page.x_ite %}
{% if jekyll.environment == "production" %}
<script defer
   src="https://cdn.jsdelivr.net/npm/x_ite@{{ site.x_ite_latest_version }}/dist/x_ite.min.js"
   integrity="{{ site.x_ite_min_js_integrity }}"
   crossorigin="anonymous"></script>
{% else %}
<script defer src="https://weiputer/x_ite/dist/x_ite.min.js"></script>
{% endif %}
<script type="module">
for (const { browser } of document .querySelectorAll ("x3d-canvas"))
{
   browser .addBrowserCallback ("check", X3D .X3DConstants .CONNECTION_ERROR, () =>
   {
      window .location .reload ();
   });
}
</script>
{% endif %}

{% if content contains '<x3d-script-area' or page.monaco %}
<script defer src="https://cdn.jsdelivr.net/npm/monaco-editor@0.56.0/min/vs/loader.js"></script>
{% endif %}

{% if content contains '<x3d-script-area' %}
{% if jekyll.environment == "production" %}
<script defer src="https://create3000.github.io/x3d-script-area/x3d-script-area.js"></script>
{% else %}
<script defer src="https://weiputer/x3d-script-area/src/x3d-script-area.js"></script>
{% endif %}
{% endif %}
